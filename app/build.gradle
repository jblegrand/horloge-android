plugins {
    id 'com.android.application'
}

android {
    namespace 'fr.ferme.horloge'
    compileSdk 34

    defaultConfig {
        applicationId "fr.ferme.horloge"
        minSdk 21
        targetSdk 28
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}
